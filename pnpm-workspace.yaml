# pnpm reads its project settings from this file. The "pnpm" field in
# package.json is no longer used.
overrides:
  cross-spawn: '>=7.0.5'
  glob: '>=10.5.0'
  rollup: '>=4.59.0 <5'
  fast-uri: '>=3.1.9 <4'
  js-yaml: '>=4.3.2 <5'
  flatted: '>=3.4.2 <4'
  browserslist: '>=4.28.7 <5'
  baseline-browser-mapping: '>=2.11.0 <3'
  serialize-javascript: '>=7.1.3 <8'
  brace-expansion@1: '>=1.1.21 <2'
  brace-expansion@2: '>=2.1.7 <3'
  minimatch@3: '>=3.1.3 <4'
  minimatch@9: '>=11.0.1 <12'
  picomatch@2: '>=2.3.2 <3'
  picomatch@4: '>=4.0.4 <5'

peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
    - decky-frontend-lib
